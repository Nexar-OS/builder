name: alsa-lib
homepage: https://github.com/alsa-project/alsa-lib/
license:
  - LGPL-2.1-or-later
description: The Advanced Linux Sound Architecture - library

version: "1.2.16.1"

version_source:
  type: github
  repo: alsa-project/alsa-lib
  identifier: tags

sources:
  - type: tarball
    name: alsa-lib
    url: https://www.alsa-project.org/files/pub/lib/alsa-lib-${version}.tar.bz2
    md5hash: c14c9f94f78f76924c13668954997a33

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools

    config_args:
      - --prefix=/usr
      - --disable-static
