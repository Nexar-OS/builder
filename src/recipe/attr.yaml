name: attr
homepage: https://savannah.nongnu.org/git/?group=attr
license: GPL-2.0-or-later
description: A utility used to manage extended attributes on filesystem objects from shell scripts

version: "2.6.0"

dependencies:
  required:
    - glibc
    - gettext
  
sources:
  - type: tarball
    name: attr
    url: "http://download.savannah.gnu.org/releases/attr/attr-${version}.tar.xz"
    md5hash: "c0516a99377b4938eeb7fb2699247e82"

build:
  method: IN_SOURCE

  build_system:
    type: autotools
  
    config_args:
      - "--prefix=/usr"