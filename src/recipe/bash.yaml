name: bash
homepage: https://www.gnu.org/software/bash/
license: GPL-3.0-or-later
description: The GNU Bourne Again SHell

version: "5.3"

version_source:
  type: web
  url: ${mirror.gnu}/bash/
  regex: bash-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - glibc
    - readline
    - ncurses
  
  optional:
    - bash-completion
  
sources:
  - type: tarball
    name: bash
    url: "${mirror.gnu}/bash/bash-${version}.tar.gz"
    md5hash: "977c8c0c5ae6309191e7768e28ebc951"

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
  
    config_args:
      - "--prefix=/usr"
      - "--without-bash-malloc"
  
  post_install: |
    mkdir -p $DESTDIR / "bin"
    ln -sf bash bin/sh