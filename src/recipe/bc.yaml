name: bc
homepage: https://savannah.nongnu.org/git/?group=attr
license: GPL-3.0-only
description: An arbitrary precision calculator language

version: "7.0.3"

dependencies:
  required:
    - glibc
    - gettext
  
sources:
  - type: tarball
    name: bc
    url: "https://github.com/gavinhoward/bc/releases/download/${version}/bc-${version}.tar.gz"
    md5hash: "a020c36c383624119cce4d2cf5d13388"
  
  - type: file
    name: gcc16.patch
    url: "file://${patches}/bc/gcc16.patch"

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
  
    config_args:
      - "--prefix=/usr"
      - "--disable-dc"
  
  patches:
    - gcc16.patch