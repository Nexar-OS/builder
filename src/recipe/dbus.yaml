name: dbus
homepage: https://www.freedesktop.org/wiki/Software/dbus/
license: [ AFL-2.1, GPL-2.0-or-later ]
description: A simple way for applications to talk to one another

version: 1.16.2

dependencies:
  required:
    - libexpat
    - libcap
    - systemd

  build:
    - meson
    - systemd
  
sources:
  - type: tarball
    name: dbus
    url: https://dbus.freedesktop.org/releases/dbus/dbus-${version}.tar.xz
    md5hash: 97832e6f0a260936d28536e5349c22e5

build:
  method: OUT_OF_SOURCE

  build_system:
    type: meson
    disable_fakeroot: True
  
    config_args:
      - --prefix=/usr
      - --sysconfdir=/etc
      - --localstatedir=/var