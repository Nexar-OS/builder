name: elfutils
homepage: https://github.com/roolebo/elfutils
license: [ GPL-3.0, GPL-2.0, LGPL-3.0 ]
description: Utilities and libraries to read, create and modify ELF binary files

version: "0.197"

version_source:
  type: nested
  
  parent:
    type: web
    url: https://sourceware.org/elfutils/ftp/
    regex: (?P<version>[0-9]\.[0-9]*)\/
  
  child:
    type: web
    url: https://sourceware.org/elfutils/ftp/{version}/
    regex: elfutils-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.bz2

dependencies:
  required:
    - glibc
    - json-c
    - libstdc++
    - bash
  
  build:
    - bzip2
    - curl
    - json-c
    - libstdc++
    - xz
    - zlib
    - zstd
  
sources:
  - type: tarball
    name: elfutils
    url: https://sourceware.org/elfutils/ftp/${version}/elfutils-${version}.tar.bz2
    md5hash: 072992c8388b958dc006c6cfb74a0100
  - type: file
    name: crc32.patch
    url: "file://elfutils/crc32.patch"

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr
      - --without-libbsd
  
  # crc32 is both provided by zlib and elfutils
  # we prefer keeping only the zlip version.
  patches:
    - crc32.patch

  post_install: |
    rm -f $DESTDIR/usr/lib/libelf.a