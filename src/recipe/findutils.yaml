name: findutils
homepage: https://www.gnu.org/software/findutils/
license: GLP-3.0-or-later
description: Basic directory searching utilities

version: 4.11.0

version_source:
  type: web
  url: ${mirror.gnu}/findutils
  regex: findutils-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - glibc
  
  build:
    - wget
  
sources:
  - type: tarball
    name: findutils
    url: ${mirror.gnu}/findutils/findutils-${version}.tar.xz
    md5hash: 512c6875ed84034dca240c4bc9380b96

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr