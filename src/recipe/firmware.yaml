name: firmware
homepage: https://gitlab.com/kernel-firmware/linux-firmware
license: https://gitlab.com/kernel-firmware/linux-firmware/-/blob/main/LICENSE
description: Collection of firmware binaries

version: "20260810"

version_source:
  type: gitlab
  repo: kernel-firmware/linux-firmware

dependencies:
  
sources:
  - type: tarball
    name: firmware
    url: https://gitlab.com/kernel-firmware/linux-firmware/-/archive/${version}/linux-firmware-${version}.tar.gz
    md5hash: 00c461b744f06359d1280c0fa73418ae

build:
  method: IN_SOURCE

  build_system:
    type: autotools

    # The make script tries to invoke a second script called "copy-firmware.sh"
    # all MAKEFLAGS will be passed as arguments and -j isn't supported.
    # Since the toolchain automatically passes -j$(nproc) through MAKEFLAGS
    # we need to manually override them.
    install_args:
      - MAKEFLAGS=