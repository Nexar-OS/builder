name: fontconfig
homepage: https://www.freedesktop.org/wiki/Software/fontconfig/
license:
  - MIT
description: Font discovery and configuration system.

version: 2.18.2

version_source:
  type: web
  url: https://www.freedesktop.org/software/fontconfig/release/
  regex: fontconfig\-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - libexpat
    - glib
    - freetype

  build:
    - libexpat
    - glib
    - freetype

sources:
  - type: tarball
    name: fontconfig
    url: https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/${version}/fontconfig-${version}.tar.xz
    md5hash: 784b516220f93441d8ffc67ee9b3b34a

build:
  method: OUT_OF_SOURCE

  build_system:
    type: meson

    config_args:
      - --prefix=/usr
      - -Dtests=disabled
      - -Ddoc=disabled
