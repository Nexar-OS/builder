name: fribidi
homepage: https://github.com/fribidi/fribidi/
license:
  - LGPL-2.1-or-later
description: A Unicode bidirectional text algorithm implementation.

version: v1.0.18

version_source:
  type: github
  repo: fribidi/fribidi

sources:
  - type: tarball
    name: fribidi
    url: https://github.com/fribidi/fribidi/releases/download/${version}/fribidi-${version.major}.${version.minor}.${version.patch}.tar.xz
    md5hash: 7df3afde2eeec4c7186f4d0798c82767

build:
  method: OUT_OF_SOURCE

  build_system:
    type: meson

    config_args:
      - --prefix=/usr
      - -Ddocs=false
      - -Dtests=false
