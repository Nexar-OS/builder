name: gdbm
homepage: https://www.gnu.org/software/gdbm/
license: GPL-3.0-or-later
description: GNU library of database functions that use extensible hashing and work similar to the standard UNIX dbm

version: "1.26"

dependencies:
  required:
    - glibc
    - readline
    - bash
  
  build:
    - readline
  
sources:
  - type: tarball
    name: gdbm
    url: https://ftpmirror.gnu.org/gnu/gdbm/gdbm-${version}.tar.gz
    md5hash: aaa600665bc89e2febb3c7bd90679115

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr