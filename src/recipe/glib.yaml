name: glib
homepage: https://gitlab.gnome.org/GNOME/glib
license: LGPL-2.1-or-later
description: Low-level core library that forms the basis for projects such as GTK and GNOME.

version: 2.89.3

version_source:
  type: nested

  parent:
    type: web
    url: https://download.gnome.org/sources/glib/
    regex: (?P<version>[0-9][A-Za-z0-9._+-]*)/
  
  child:
    type: web
    url: https://download.gnome.org/sources/glib/{version}/
    regex: glib-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - glibc
    - bash
  
sources:
  - type: tarball
    name: glib
    url: https://download.gnome.org/sources/glib/${version.major}.${version.minor}/glib-${version}.tar.xz
    md5hash: a00f19c6efdf9ecf1b51d0597d7931cd

build:
  method: OUT_OF_SOURCE

  build_system:
    type: meson
      
    config_args:
      - --prefix=/usr
      - -Ddtrace=disabled
      - -Dintrospection=disabled