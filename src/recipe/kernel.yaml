name: kernel
homepage: https://kernel.org/
license: GPL-2.0
description: The linux kernel

version: "6.18.42"

dependencies:
  
sources:
  - type: tarball
    name: kernel
    url: https://cdn.kernel.org/pub/linux/kernel/v${version.major}.x/linux-${version}.tar.xz
    md5hash: 6f8233a94b0774e64df2bafff25a63d6

build:
  method: IN_SOURCE

  build_system:
    type: custom
  
    configure: |
      make \
        ARCH=${target.kernel_arch} \
        CROSS_COMPILE=${target.triple}- \
        defconfig
    
    build: |
      make \
        ARCH=${target.kernel_arch} \
        CROSS_COMPILE=${target.triple}-
    
    install: |
      cd $BUILD
      make \
        ARCH=${target.kernel_arch} \
        CROSS_COMPILE=${target.triple}- \
        modules_install INSTALL_MOD_PATH="$DESTDIR"
      
      mkdir -p "$DESTDIR"/boot/

      cp ${target.kernel_image.src} "$DESTDIR"/boot/${target.kernel_image.filename}-${version}