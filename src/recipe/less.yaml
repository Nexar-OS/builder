name: less
homepage: https://www.greenwoodsoftware.com/less/
license: [ GPL-3.0-or-later, LicenseRef-Less ]
description: Terminal utility for viewing text files

version: "704"

version_source:
  type: web
  url: ${mirror.gnu}/less
  regex: less-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - glibc
    - ncurses
  
  build:
    - ncurses
  
sources:
  - type: tarball
    name: less
    url: ${mirror.gnu}/less/less-${version}.tar.gz
    md5hash: c4c9eea5b1862783b078c67ca67c9185

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr