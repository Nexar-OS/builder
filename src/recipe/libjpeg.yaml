name: libjpeg
homepage: https://libjpeg-turbo.org
license:
  - IJG
  - BSD-3-Clause
description: A JPEG image codec that uses SIMD instructions to accelerate baseline
  and progressive JPEG compression

version: 3.2.1

version_source:
  type: github
  repo: libjpeg-turbo/libjpeg-turbo

sources:
  - type: tarball
    name: libjpeg
    url: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${version}/libjpeg-turbo-${version}.tar.gz
    md5hash: dad2613d70883fee715599d5f363bf46

build:
  method: OUT_OF_SOURCE

  build_system:
    type: cmake

    config_args:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DENABLE_SHARED=OFF
      - -DENABLE_STATIC=ON
    
  post_install: |
    rm -f $DESTDIR/usr/lib/libturbojpeg.a