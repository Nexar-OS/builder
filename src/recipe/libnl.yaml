name: libnl
homepage: https://github.com/thom311/libnl/
license: LGPL-2.1-or-later
description: Library for applications that use Netlink sockets

version: "3.12.0"

dependencies:
  required:
    - libgcc
    - glibc
  
sources:
  - type: tarball
    name: libnl
    url: https://github.com/thom311/libnl/releases/download/libnl3_12_0/libnl-${version}.tar.gz
    md5hash: f9112ca215807fe65eecd583d8f180cc

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr