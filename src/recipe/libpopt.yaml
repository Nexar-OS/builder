name: libpopt
homepage: https://github.com/rpm-software-management/popt
license: GPL-3.0-or-later
description: Library for parsing command-line options

version: "1.19"

version_source:
  type: nested
  
  parent:
    type: web
    url: https://ftp.osuosl.org/pub/rpm/popt/releases/
    regex: popt-(?P<version>[0-9][A-Za-z0-9._+-]*)
  
  child:
    type: web
    url: https://ftp.osuosl.org/pub/rpm/popt/releases/popt-{version}/
    regex: popt-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - glibc

sources:
  - type: tarball
    name: libpopt
    url: https://ftp.osuosl.org/pub/rpm/popt/releases/popt-1.x/popt-${version}.tar.gz
    md5hash: eaa2135fddb6eb03f2c87ee1823e5a78

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr