name: libunistring
homepage: https://www.gnu.org/software/libunistring/
license: [ GPL-2.0-or-later, LGPL-3.0-or-later ]
description: Library for handling Unicode and C strings

version: "1.4.2"

dependencies:
  required:
    - glibc
    - openssl
  
  build:
    - openssl
  
sources:
  - type: tarball
    name: libunistring
    url: https://ftp.gnu.org/gnu/libunistring/libunistring-${version}.tar.gz
    md5hash: a1b88d4c0f3b0504d10cfe2a76a7bee7

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr
      - --with-openssl