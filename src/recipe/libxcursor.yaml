name: libxcursor
homepage: https://xorg.freedesktop.org/archive/individual/lib/
license:
  - MIT
description: X11 cursor management library.

version: 1.1.5.2

version_source:
  type: web
  url: https://xorg.freedesktop.org/archive/individual/lib/
  regex: libXcursor\-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - libx11
    - libxfixes

  build:
    - xorgproto
    - libx11
    - libxfixes

sources:
  - type: tarball
    name: libxcursor
    url: https://xorg.freedesktop.org/archive/individual/lib/libXcursor-${version}.tar.gz
    md5hash: acc2000f2f51f8266cb08c9790c65011

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools

    config_args:
      - --prefix=/usr
      - --disable-static
