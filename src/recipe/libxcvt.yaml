name: libxcvt
homepage: https://xorg.freedesktop.org/archive/individual/lib/
license:
  - MIT
description: X11 cvt library.

version: 0.1.3

version_source:
  type: web
  url: https://xorg.freedesktop.org/archive/individual/lib/
  regex: libxcvt\-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - libx11
    - libxfixes

  build:
    - xorgproto
    - libx11
    - libxfixes

sources:
  - type: tarball
    name: libxcvt
    url: https://xorg.freedesktop.org/archive/individual/lib/libxcvt-${version}.tar.xz
    md5hash: 7fb9c51d33a680f724f34da41768b1d0

build:
  method: OUT_OF_SOURCE

  build_system:
    type: meson

    config_args:
      - --prefix=/usr