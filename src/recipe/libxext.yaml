name: libxext
homepage: https://xorg.freedesktop.org/archive/individual/lib/
license:
  - MIT
description: X11 extension client library.

version: 1.3.7

version_source:
  type: web
  url: https://xorg.freedesktop.org/archive/individual/lib/
  regex: libXext\-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - libx11

  build:
    - libx11
    - xorgproto

sources:
  - type: tarball
    name: libxext
    url: https://xorg.freedesktop.org/archive/individual/lib/libXext-${version}.tar.gz
    md5hash: bfd5478e3bd1cd2dfcfc1a2d056f803a

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools

    config_args:
      - --prefix=/usr
      - --disable-static
