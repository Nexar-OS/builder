name: libxshmfence
homepage: https://xorg.freedesktop.org/archive/individual/lib/
license:
  - MIT
description: X11 shared-memory synchronization fences library.

version: 1.3.3

version_source:
  type: web
  url: https://xorg.freedesktop.org/archive/individual/lib/
  regex: libxshmfence\-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - libx11
    - libxfixes

  build:
    - xorgproto
    - libx11
    - libxfixes

sources:
  - type: tarball
    name: libxshmfence
    url: https://xorg.freedesktop.org/archive/individual/lib/libxshmfence-${version}.tar.xz
    md5hash: 9805be7e18f858bed9938542ed2905dc

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools

    config_args:
      - --prefix=/usr
      - --disable-static
