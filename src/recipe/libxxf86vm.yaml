name: libxxf86vm
homepage: https://xorg.freedesktop.org/archive/individual/lib/
license:
  - MIT
description: X11 XFree86 video mode extension library.

version: 1.1.7

version_source:
  type: web
  url: https://xorg.freedesktop.org/archive/individual/lib/
  regex: libXxf86vm\-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - libx11
    - libxfixes

  build:
    - xorgproto
    - libx11
    - libxfixes

sources:
  - type: tarball
    name: libxxf86vm
    url: https://xorg.freedesktop.org/archive/individual/lib/libXxf86vm-${version}.tar.xz
    md5hash: bea9e3707fae6c3275769e771006fa0f

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools

    config_args:
      - --prefix=/usr
      - --disable-static
