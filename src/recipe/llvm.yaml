name: llvm
homepage: https://llvm.org/
license:
  - Apache-2.0 WITH LLVM-exception
description: A collection of modular and reusable compiler and toolchain technologies.

version: llvmorg-23.1.3

version_source:
  type: github
  repo: llvm/llvm-project

dependencies:
  required:
    - zlib
    - zstd
  
  build:
    - zlib
    - zstd

sources:
  - type: tarball
    name: llvm
    url: https://github.com/llvm/llvm-project/releases/download/${version}/llvm-project-${version.major}.${version.minor}.${version.patch}.src.tar.xz
    md5hash: d7e227fe471d80d5e2d411127a0123b1

build:
  method: OUT_OF_SOURCE

  build_system:
    type: custom

    prepare: |
      mkdir -p $BUILD
    
    configure: |
      # x86, arm64, arm, riscv
      arch="${target.kernel_arch}"

      # LLVMs build scripts use a different format for
      # target architechtures than this build system does.
      # So they need to be convered manually.
      case "$arch" in
        x86) llvm_arch="X86;AMDGPU" ;;
        arm64) llvm_arch="AArch64" ;;
        arm) llvm_arch="ARM" ;;
        riscv) llvm_arch="RISCV;AMDGPU" ;;
        *) llvm_arch="$arch" ;;
      esac

      cmake -S "$SOURCE"/llvm -B "$BUILD" \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DLLVM_TARGETS_TO_BUILD="$llvm_arch;SPIRV" \
        -DLLVM_ENABLE_PROJECTS=clang \
        -DLLVM_BUILD_TESTS=OFF \
        -DLLVM_INCLUDE_TESTS=OFF \
        -DLLVM_INCLUDE_EXAMPLES=OFF \
        -DLLVM_INCLUDE_BENCHMARKS=OFF \
        -DLLVM_INCLUDE_DOCS=OFF \
        -DLLVM_ENABLE_TERMINFO=OFF \
        -DLLVM_ENABLE_FFI=OFF \
        -DLLVM_ENABLE_ZLIB=ON \
        -DLLVM_ENABLE_ZSTD=ON \
        -DLLVM_ENABLE_RTTI=ON \
        -DLLVM_BUILD_LLVM_DYLIB=ON \
        -DLLVM_LINK_LLVM_DYLIB=ON

    build: |
      cmake --build "$BUILD" --parallel ${num_jobs} 
    
    install: |
      DESTDIR="$DESTDIR" cmake --install "$BUILD"