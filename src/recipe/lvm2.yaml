name: lvm2
homepage: https://sourceware.org/lvm2/
license: [ GPL-2.0-only, LGPL-2.1-only ]
description: Utilities for managing Logical Volume Manager 2 storage

version: "2.03.42"

version_source:
  type: web
  url: https://sourceware.org/ftp/lvm2/
  regex: LVM2.(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.tgz

dependencies:
  required:
    - bash
    - glibc
    - util-linux
    - systemd
    - readline
    - libaio
  
  build:
    - libaio
    - systemd
  
sources:
  - type: tarball
    name: lvm2
    url: https://sourceware.org/ftp/lvm2/LVM2.${version}.tgz
    md5hash: 1cfc17fcbdc5103492b4504c5ddaa274

build:
  method: IN_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr