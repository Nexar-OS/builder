name: nano
homepage: https://nano-editor.org/
license: GPL-3.0-or-later
description: Enhanced command-line text editor based on Pico

version: "9.2"

version_source:
  type: nested
  
  parent:
    type: web
    url: https://www.nano-editor.org/dist/
    regex: v(?P<version>[0-9])/
  
  child:
    type: web
    url: https://www.nano-editor.org/dist/v{version}/
    regex: nano-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - file
    - glibc
    - ncurses
  
  build:
    - ncurses
  
sources:
  - type: tarball
    name: nano
    url: https://www.nano-editor.org/dist/v9/nano-${version}.tar.xz
    md5hash: 9bb0f37945afa964d16bffd9e4da3106

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr