name: nspr
homepage: https://firefox-source-docs.mozilla.org/nspr/index.html
license: MPL-2.0
description: Netscape Portable Runtime

version: "4.40"

dependencies:
  required:
    - glibc
    - bash
    - zlib
  
sources:
  - type: tarball
    name: nspr
    url: https://archive.mozilla.org/pub/nspr/releases/v${version}/src/nspr-${version}.tar.gz
    md5hash: 0c3c871158cc9af694f1f7d2b799ffd8

build:
  method: IN_SOURCE

  build_system:
    type: autotools
  
    config_args:
      - --prefix=/usr
      - --libdir=/usr/lib
      - --enable-optimize
      - --disable-debug
      - --enable-64bit

  prepare: |
    mv nspr/* ./
    rm -R nspr