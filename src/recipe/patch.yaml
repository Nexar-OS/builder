name: patch
homepage: https://www.gnu.org/software/patch/
license: GPL
description: Utility for applying patch files to source files

version: "2.8"

dependencies:
  required:
    - attr
    - glibc
  
sources:
  - type: tarball
    name: patch
    url: https://ftpmirror.gnu.org/gnu/patch/patch-${version}.tar.xz
    md5hash: 149327a021d41c8f88d034eab41c039f

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr