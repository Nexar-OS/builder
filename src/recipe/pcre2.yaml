name: pcre2
homepage: https://github.com/PCRE2Project/pcre2/
license:
  - BSD-3-Clause
description: Regular expression library.

version: pcre2-10.49

version_source:
  type: github
  repo: PCRE2Project/pcre2

dependencies:
  optional:
    - readline
    - zlib
    - bzip2

  build:
    - pkgconf
    - bzip2
    - readline

sources:
  - type: tarball
    name: pcre2
    url: https://github.com/PCRE2Project/pcre2/releases/download/${version}/${version}.tar.gz
    md5hash: 40dc26f12d94443502eb98f085f89d50

build:
  method: OUT_OF_SOURCE

  build_system:
    type: cmake

    config_args:
      - -DBUILD_SHARED_LIBS=ON
      - -DPCRE2_BUILD_PCRE2_8=ON