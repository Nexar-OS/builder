name: readline
homepage: https://tiswww.case.edu/php/chet/readline/rltop.html
license: GPL-3.0-or-later
description: GNU library for command-line input and editing

version: "8.3"

dependencies:
  required:
    - glibc
    - ncurses
  
  build:
    - ncurses
  
sources:
  - type: tarball
    name: readline
    url: https://ftp.gwdg.de/pub/gnu/ftp/gnu/readline/readline-${version}.tar.gz
    md5hash: 25a73bfb2a3ad7146c5e9d4408d9f6cd

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr
      - --with-curses
      - --with-shared-termcap-library