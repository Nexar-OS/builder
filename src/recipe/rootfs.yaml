name: rootfs
homepage: None
license: None
description: The core filesystem layout

version: "1.0"

dependencies:
  required:
    - iana-etc

sources: []

build:
  method: IN_SOURCE

  build_system:
    type: custom

    install: |
      cd "$DESTDIR"

      # Create directory layout
      mkdir -p etc tmp var root home dev proc sys run mnt opt \
            usr/{bin,include,lib,${target.libdir.name}} \
            usr/share/{man,info,doc} \
            var/{cache,lib,log,tmp,run,mail} \
            run/{lock,user} \
            etc/{profile.d,}
      
      # Kernel/runtime mountpoints
      chmod 0555 proc sys

      # Root's home directory
      chmod 0700 root

      # Runtime locking
      chmod 0775 run/lock

      # Tmp directories
      chmod 1777 tmp var/tmp

      # Mail directory
      chmod 755 var/mail

      # Merged /usr compatibility symlinks
      ln -sfn usr/bin bin
      ln -sfn usr/bin sbin
      ln -sfn bin usr/sbin
      ln -sfn usr/lib lib
      ln -sfn usr/lib ${target.libdir.name}
      ln -sfn lib usr/${target.libdir.name}

      # Runtime compatibility
      ln -sfn /run var/run
      ln -sfn /run/lock var/lock

      create_file() {
          local name="$1"
          local owner="${2:-root:root}"
          local mode="${3:-0644}"

          mkdir -p "$(dirname "$name")"
          cat > "$name"
          echo "\n" >> "$name"
          chown "$owner" "$name"
          chmod "$mode" "$name"
      }

      # Create passwd file
      create_file etc/passwd <<'EOF'
      root:x:0:0:root:/root:/bin/sh
      EOF

      # Create group file
      create_file etc/group <<'EOF'
      root:x:0:
      mail:x:12:
      EOF

      # Create shadow file
      create_file etc/shadow root:root 0600 <<'EOF'
      root:*:2000::::::
      EOF
      
      # Create gshadow file
      create_file etc/gshadow root:root 0600 <<'EOF'
      root:::
      mail:::
      EOF

      # Create nsswitch file
      create_file etc/nsswitch.conf <<'EOF'
      passwd: files
      group: files
      shadow: files

      hosts: files dns
      networks: files
      protocols: files
      services: files
      ethers: files
      rpc: files
      EOF

      # Create hosts file
      create_file etc/hosts root:root 0644 <<'EOF'
      127.0.0.1     localhost
      ::1           localhost
      EOF

      # Create shells file
      create_file etc/shells root:root 0644 <<'EOF'
      /bin/sh
      /usr/bin/sh
      /bin/bash
      /usr/bin/bash
      EOF

      # Create shells file
      create_file etc/profile root:root 0644 <<'EOF'
      export PATH="/usr/local/sbin/:/usr/local/bin/:/usr/sbin:/usr/bin"

      if [-d /etc/profile.d ]; then
        for f in /etc/profile.d/*.sh; do
          [ -r "$f" ] && . "$f"
        done
      fi
      EOF

      # Create os-release file
      create_file etc/os-release <<'EOF'
      NAME="NexarOS"
      PRETTY_NAME="NexarOS"
      ID=nexar
      ANSI_COLOR="38;2;23;147;209"
      HOME_URL=""
      DOCUMENTATION_URL=""
      SUPPORT_URL=""
      BUG_REPORT_URL=""
      PRIVACY_POLICY_URL=""
      LOGO=nexar-logo
      EOF