name: rust
homepage: https://github.com/rust-lang/rust/
license:
  - Apache-2.0
  - MIT
description: Empowering everyone to build reliable and efficient software.

version: 1.99.1

version_source:
  type: github
  repo: rust-lang/rust

dependencies:
  required:
    - glibc
    - zlib
    - llvm
    - openssl
    - zstd

  build:
    - zlib
    - zstd
    - openssl
    - llvm

sources:
  - type: tarball
    name: rust
    url: https://static.rust-lang.org/dist/rustc-${version}-src.tar.xz
    md5hash: 0124cb31c9f2e626d75a4bf48de126dc

build:
  method: IN_SOURCE

  build_system:
    type: custom

    configure: |
      cat > bootstrap.toml <<'EOF'
      [build]
      target = [ "${target.arch}-unknown-linux-${target.abi}" ]
      build-dir = "$BUILD"

      docs = false
      extended = true
      profiler = true

      [install]
      prefix = "/usr"
      sysconfdir = "/etc"

      [rust]
      channel = "stable"

      [gcc]
      download-ci-gcc = false

      [llvm]
      download-ci-llvm = true
      EOF
    
    build: |
      ./x build -j ${num_jobs}
    
    install: |
      cd $BUILD
      DESTDIR="$DESTDIR" \
        ./x install