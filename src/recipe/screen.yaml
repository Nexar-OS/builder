name: screen
homepage: https://www.gnu.org/software/screen/
license: GPL-3.0-or-later
description: Terminal multiplexer for managing multiple sessions in one terminal

version: "5.0.2"

version_source:
  type: web
  url: ${mirror.gnu}/screen
  regex: screen-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - ncurses
    - linux-pam
  
sources:
  - type: tarball
    name: screen
    url: ${mirror.gnu}/screen/screen-${version}.tar.gz
    md5hash: 76c4f967284c1879f0a1423d318471b3

build:
  method: IN_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr