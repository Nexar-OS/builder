name: tar
homepage: https://www.gnu.org/software/tar/
license: GPL-3.0-or-later
description: Utility for archiving, backing up, and transferring files

version: "1.35"

version_source:
  type: web
  url: ${mirror.gnu}/tar/
  regex: tar-(?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.xz

dependencies:
  required:
    - glibc
    - attr
  
sources:
  - type: tarball
    name: tar
    url: ${mirror.gnu}/tar/tar-${version}.tar.xz
    md5hash: a2d8042658cfd8ea939e6d911eaf4152

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr