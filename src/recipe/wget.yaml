name: wget
homepage: https://www.gnu.org/software/wget/wget.html
license: GPL-3.0-or-later
description: Network utility for downloading files from the web

version: "1.25.0"

dependencies:
  required:
    - glibc
    - libidn2
    - libpsl
    - util-linux
    - zlib
  
  optional:
    - ca-certificates
  
sources:
  - type: tarball
    name: wget
    url: https://ftpmirror.gnu.org/gnu/wget/wget-${version}.tar.gz
    md5hash: c70ba58b36f944e8ba1d655ace552881

build:
  method: OUT_OF_SOURCE

  build_system:
    type: autotools
      
    config_args:
      - --prefix=/usr
      - --with-openssl
      - --with-ssl=openssl