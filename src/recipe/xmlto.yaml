name: xmlto
homepage: https://pagure.io/xmlto/
license:
  - GPL-2.0-or-later
description: Shell script for converting XML files to various formats

version: 0.0.29

version_source:
  type: web
  url: https://codeberg.org/xmlto/xmlto/tags
  regex: (?P<version>[0-9][A-Za-z0-9._+-]*)\.tar\.gz

dependencies:
  required:
    - libxml2

  build:
    - libxml2
    - docbook-xsl

sources:
  - type: tarball
    name: xmlto
    url: https://codeberg.org/xmlto/xmlto/archive/${version}.tar.gz
    md5hash: c10ad461f2d417ea3d4f095799e2241a

build:
  method: OUT_OF_SOURCE

  prepare: |
    cd $SOURCE
    autoreconf -fi

  post_install: |
    cd "$SOURCE"
    autoreconf -fi

    sed -i 's|^prefix=/usr$|prefix="${host_tools}/usr"|' "$DESTDIR/usr/bin/xmlto"

  build_system:
    type: autotools